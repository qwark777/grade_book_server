version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gradebook_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DB:-grade_book}
      MYSQL_USER: ${MYSQL_USER:-gradebook_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: gradebook_server
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-gradebook_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DB: ${MYSQL_DB:-grade_book}
      MYSQL_PORT: 3306
      APP_HOST: 0.0.0.0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_FULL_NAME: ${OWNER_FULL_NAME:-}
    volumes:
      - profile_photos_data:/app/profile_photos
      - achievements_data:/app/achievements
    ports:
      - "8001:8001"
    command: >
      sh -c "
        sleep 10 &&
        python -c 'import asyncio; from app.db.connection import init_db; asyncio.run(init_db())' &&
        python scripts/auto_create_owner.py &&
        python main_new.py
      "

volumes:
  mysql_data:
  profile_photos_data:
  achievements_data:
