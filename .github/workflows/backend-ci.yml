name: Backend CI

on:
  push:
    paths:
      - "app/**"
      - "scripts/**"
      - "migrations/**"
      - "requirements.txt"
      - "test_*.py"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - "migrations/**"
      - "requirements.txt"
      - "test_*.py"
      - ".github/workflows/backend-ci.yml"

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit semgrep bandit

      - name: Run backend checks
        run: bash scripts/security_check.sh
