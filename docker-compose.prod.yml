services:
  db:
    image: mysql:8.0
    container_name: gradebook_mysql_prod
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DB:-grade_book}
      MYSQL_USER: ${MYSQL_USER:-gradebook_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gradebook_internal

  realtime:
    image: redis:7.4-alpine
    container_name: gradebook_realtime_prod
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - gradebook_internal

  app:
    build: .
    container_name: gradebook_server_prod
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers "$${UVICORN_WORKERS:-2}"
    depends_on:
      db:
        condition: service_healthy
      realtime:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-gradebook_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DB: ${MYSQL_DB:-grade_book}
      MYSQL_PORT: 3306
      INIT_DB_ON_STARTUP: ${INIT_DB_ON_STARTUP:-false}
      APP_HOST: 0.0.0.0
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      OWNER_USERNAME: ${OWNER_USERNAME:-owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?OWNER_PASSWORD is required}
      OWNER_FULL_NAME: ${OWNER_FULL_NAME:-System Owner}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:?BACKEND_CORS_ORIGINS is required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?TRUSTED_HOSTS is required}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-240}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-15}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-500}
      MAX_WEBSOCKETS_PER_USER: ${MAX_WEBSOCKETS_PER_USER:-4}
      REALTIME_REDIS_URL: ${REALTIME_REDIS_URL:-redis://realtime:6379/0}
      REALTIME_REDIS_CHANNEL: ${REALTIME_REDIS_CHANNEL:-gradebook:realtime}
      REALTIME_PRESENCE_TTL_SECONDS: ${REALTIME_PRESENCE_TTL_SECONDS:-90}
      REALTIME_BROKER_REQUIRED: ${REALTIME_BROKER_REQUIRED:-true}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-none}
      PAYMENT_PROVIDER_PUBLIC_NAME: ${PAYMENT_PROVIDER_PUBLIC_NAME:-}
      PAYMENT_PROVIDER_ENABLED: ${PAYMENT_PROVIDER_ENABLED:-false}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-7}
      SUBSCRIPTION_SYNC_INTERVAL_SECONDS: ${SUBSCRIPTION_SYNC_INTERVAL_SECONDS:-3600}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-GradeBook}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      LANDING_LEADS_EMAIL: ${LANDING_LEADS_EMAIL:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-https://gradebook.su/app/}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-30}
    volumes:
      - profile_photos_data:/app/profile_photos
      - achievements_data:/app/achievements
      - homework_submissions_data:/app/homework_submissions
      - homework_attachments_data:/app/homework_attachments
      - message_attachments_data:/app/message_attachments
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; request=urllib.request.Request('http://127.0.0.1:8001/api/v1/health', headers={'Host':'api.gradebook.su'}); urllib.request.urlopen(request, timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - gradebook_internal

volumes:
  mysql_data:
  profile_photos_data:
  achievements_data:
  homework_submissions_data:
  homework_attachments_data:
  message_attachments_data:

networks:
  gradebook_internal:
    driver: bridge
